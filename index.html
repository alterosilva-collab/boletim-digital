<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header class="header">
    <div class="container">
      <h1>Boletim Digital</h1>
      <p class="subtitulo">Estudante Exemplo — 8º Ano</p>
    </div>
  </header>

  <main class="container">
    <!-- Seção de Cards de Resumo -->
    <section class="cards-grid">
      <div class="card">
        <h3>Média Geral</h3>
        <p class="card-valor" id="card-media-geral">—</p>
      </div>
      <div class="card">
        <h3>Total de Faltas</h3>
        <p class="card-valor" id="card-total-faltas">—</p>
      </div>
      <div class="card">
        <h3>Disciplinas - Bom Desempenho</h3>
        <p class="card-valor" id="card-bom-desempenho">—</p>
      </div>
      <div class="card">
        <h3>Disciplinas - Atenção</h3>
        <p class="card-valor" id="card-atencao">—</p>
      </div>
      <div class="card">
        <h3>Frequência Demonstrativa</h3>
        <p class="card-valor" id="card-frequencia">92%</p>
        <span class="card-status">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de Notas e Faltas -->
    <section class="tabela-section">
      <h2>Notas e Frequência por Disciplina</h2>
      <div class="tabela-container">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="tabela-corpo">
            <!-- As linhas da tabela serão inseridas pelo JavaScript -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
